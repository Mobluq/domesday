[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domesday-gpu"
version = "0.0.0"
description = "Domesday GPU worker pool: privacy pass, frame selection, detect and track, and OCR and barcode reading."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
domesday-gpu-worker = "domesday_gpu.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
domesday_gpu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["domesday_gpu"]
